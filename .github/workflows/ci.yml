# CI: runs on every pull request and on every push to main.
# Lint + unit tests (incl. PySpark) + CDK synth and template tests. No AWS account needed.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - uses: actions/setup-java@v6 # PySpark needs a Java runtime
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Unit tests
        run: uv run pytest -q

  infra:
    name: CDK synth and template tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Template tests
        working-directory: infra
        run: uv run --locked --group infra pytest -q test_stack.py

      - name: cdk synth
        working-directory: infra
        run: cdk synth --quiet
