# Deploy: started by hand (Actions tab -> Deploy -> Run workflow), only from main.
# The "production" environment can require a reviewer's approval before this job runs
# (repo Settings -> Environments -> production -> Required reviewers).
# AWS access uses OIDC: GitHub gets short-lived credentials for one role; no AWS keys are stored in GitHub.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      alert_email:
        description: "Email for failure alerts (optional)"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write # needed to request the OIDC token

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: cdk deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install
        run: |
          uv sync --locked
          npm install -g aws-cdk

      - name: Tests must pass before deploying
        run: uv run pytest -q

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: cdk deploy
        working-directory: infra
        env:
          ALERT_EMAIL: ${{ inputs.alert_email }}
        run: |
          if [ -n "$ALERT_EMAIL" ]; then CONTEXT="-c alert_email=$ALERT_EMAIL"; fi
          cdk deploy WistiaPipeline --require-approval never $CONTEXT
